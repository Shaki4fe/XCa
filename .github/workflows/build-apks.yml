name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MyTube (root project)
        run: gradle :app:assembleDebug --no-daemon

      - name: Build QuickDial (apps/quickdial)
        run: gradle -p apps/quickdial :app:assembleDebug --no-daemon

      - name: Upload MyTube APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload QuickDial APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickDial-debug-apk
          path: apps/quickdial/app/build/outputs/apk/debug/*.apk
